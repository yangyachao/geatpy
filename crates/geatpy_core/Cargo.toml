[package]
name = "geatpy-core"
version = "2.7.0"
edition = "2021"
authors = ["Geatpy Rust Port Team"]
description = "High-performance Rust implementation of Geatpy core operators"
license = "LGPL-3.0"

[lib]
name = "_geatpy_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38"] }
numpy = "0.23"
ndarray = "0.16"
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"

